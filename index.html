<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Hello world!</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__logo">
          <img src="img/logo.png" alt="Логотип" />
        </div>
        <nav class="header__navigation">
          <ul class="header__list">
            <li class="header__item">
              <a href="#" class="header__link">Home</a>
            </li>
            <li class="header__item">
              <a href="#" class="header__link">Shop</a>
            </li>
            <li class="header__item">
              <a href="#" class="header__link">About</a>
            </li>
            <li class="header__item">
              <a href="#" class="header__link">Contact</a>
            </li>
          </ul>
        </nav>
        <form class="header__search" action="#">
          <input
            type="text"
            class="search-input"
            placeholder="Search item..."
          />
        </form>
        <div class="header__icons">
          <a class="header__icon" href="#"
            ><img src="img/Line Rounded/Heart.png" alt="избранное"
          /></a>
          <a class="header__icon" href="#"
            ><img src="img/Line Rounded/Shopping cart.png" alt="Корзина"
          /></a>
          <a class="header__icon" href="#"
            ><img src="img/Line Rounded/User.png" alt="Профиль"
          /></a>
        </div>
      </div>
    </header>
  </body>
</html>
